[program:horizon]
process_name=%(program_name)s
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
startsecs=5
startretries=100
; On SIGTERM the master waits for its workers to drain their in-flight jobs.
; Supervisor's 10s default kills it long before that finishes, dropping the jobs
; and leaving stale heartbeat records in Redis, so allow the drain to complete.
stopwaitsecs=300
; Horizon's workers are forked children, so signals have to reach the whole group.
stopasgroup=true
killasgroup=true
user=www-data
; Supervisor writes each stream to a single destination, so a log file here would
; keep Horizon's output out of `docker logs` and `kubectl logs`, where the log
; shippers read. maxbytes=0 disables supervisor's rotation, which cannot apply to
; a pipe. Streams stay separate to match the stdout/stderr split in config/logging.php.
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
