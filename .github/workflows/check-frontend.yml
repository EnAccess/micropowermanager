name: Code Quality (Frontend)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  eslint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18.20.4

      - name: Install Node.js dependencies
        run: npm install
        working-directory: ./src/frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: ./src/frontend

  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18.20.4

      - name: Install Node.js dependencies
        run: npm install
        working-directory: ./src/frontend

      - name: Run Prettier
        run: npm run prettier
        working-directory: ./src/frontend

  misc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18.20.4

      - name: Install Node.js dependencies
        run: npm install
        working-directory: ./src/frontend

      - name: Check i18n locale JSON files
        # Verifies every locale file is deep-sorted and has the same keys as en.json.
        # To fix locally: npm run i18n:fix-json (sorting) / npm run i18n:translate-json (missing keys).
        run: npm run lang:check
        working-directory: ./src/frontend

  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: 18.20.4

      - name: Install Node.js dependencies
        run: npm install
        working-directory: ./src/frontend

      - name: Build npm on production mode
        run: npm run build
        working-directory: ./src/frontend
