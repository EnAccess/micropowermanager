name: Check Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  prettier:
    name: Lint prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Run Prettier on Docs
        working-directory: docs
        run: npx prettier . --check

  check-plugins-front-matter:
    name: Check YAML front matter on plugin docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for custom YAML keys
        # Skipping files without front-matter due to `yq` bug
        # See: https://github.com/mikefarah/yq/issues/2997
        run: |
          set -o pipefail
          status=0
          while read -r file; do
            if [ "$(head -n 1 "$file")" != "---" ]; then
              echo "Skipping $file (no frontmatter)"
              continue
            fi
            echo "Check for xxx keys on Markdown Frontmatter for $file"
            yq --front-matter=extract 'has("mpm_plugin_status") and has("mpm_plugin_doc")' -e "$file" >> /dev/null || status=1
          done < <(find docs/integrations-guide -name '*.md')
          exit $status

  check-build:
    name: Check Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Install tooling
        working-directory: docs
        run: npm install

      - name: Build docs with VitePress
        working-directory: docs
        run: npm run docs:build
