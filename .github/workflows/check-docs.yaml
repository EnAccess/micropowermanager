name: Check Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  prettier:
    name: Lint prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Run Prettier on Docs
        working-directory: docs
        run: npx prettier . --check

  check-plugins-front-matter:
    name: Check YAML front matter on plugin docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for custom YAML keys
        # Skipping files without front-matter due to `yq` bug
        # See: https://github.com/mikefarah/yq/issues/2997
        run: |
          set -o pipefail
          required_keys=(mpm_plugin_status mpm_plugin_doc)
          status=0
          while read -r file; do
            if [ "$(head -n 1 "$file")" != "---" ]; then
              echo "Skipping $file (no frontmatter)"
              continue
            fi
            echo "Checking $file"
            for key in "${required_keys[@]}"; do
              yq --front-matter=extract -e "has(\"$key\")" "$file" > /dev/null || { echo "::error file=$file,line=1::Missing '$key' in front matter"; status=1; }
            done
          done < <(find docs/integrations-guide -name '*.md' -not -name index.md -not -name overview.md)
          exit $status

  check-build:
    name: Check Docs build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/iron

      - name: Install tooling
        working-directory: docs
        run: npm install

      - name: Build docs with VitePress
        working-directory: docs
        run: npm run docs:build
