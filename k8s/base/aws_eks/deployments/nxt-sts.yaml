# Token engine for the StsMeterVend plugin. nxt-sts has no authentication, so it is
# exposed only as a ClusterIP service for the backend and queue-worker pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nxt-sts
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nxt-sts
  template:
    metadata:
      labels:
        app: nxt-sts
    spec:
      containers:
        - image: ghcr.io/nxtgrid/nxt-sts:v1.0.4
          imagePullPolicy: IfNotPresent
          name: nxt-sts
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
